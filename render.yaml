# DEMONSTRAÇÃO TEMPORÁRIA: somente planos gratuitos, sem upgrades automáticos.
# PostgreSQL free expira em 30 dias. Revise disponibilidade/limites antes de Apply.
# Não importe dados financeiros reais. A criação depende da confirmação humana.
services:
  - type: web
    name: confere-demo
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health/readiness
    autoDeployTrigger: "off"
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod,render
      - key: DATABASE_URL
        fromDatabase:
          name: confere-demo-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: ""
      - key: PASSWORD_RESET_ENABLED
        value: "false"
      - key: API_DOCS_ENABLED
        value: "false"
databases:
  - name: confere-demo-db
    plan: free
    region: oregon
    databaseName: confere
    user: confere
    ipAllowList: []
