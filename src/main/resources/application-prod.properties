# Recuperação é opcional. Ative somente depois de provisionar SMTP/frontend HTTPS.
app.reset.enabled=${PASSWORD_RESET_ENABLED:false}
app.reset.url=${RESET_PASSWORD_URL:}
app.email.from=${EMAIL_FROM:}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
management.health.mail.enabled=false
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.mail=WARN
logging.level.org.hibernate.orm.connections.pooling=WARN
logging.level.org.flywaydb.core.FlywayExecutor=WARN
logging.level.com.zaxxer.hikari=INFO
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
server.ssl.enabled=${TLS_ENABLED:false}
server.ssl.key-store=${TLS_KEY_STORE:}
server.ssl.key-store-password=${TLS_KEY_STORE_PASSWORD:}
server.ssl.key-store-type=PKCS12
# Alternativa preferida: proxy reverso HTTPS na infraestrutura. Veja docs/implantacao.md.
