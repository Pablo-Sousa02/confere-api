# HTTPS termina no proxy gerenciado pelo Render; não exige keystore no contêiner.
server.address=0.0.0.0
server.ssl.enabled=false
server.tomcat.threads.max=30
server.tomcat.threads.min-spare=2
# Mantém IP de conexão; não confia em Forwarded/X-Forwarded-For enviados livremente.
server.forward-headers-strategy=none
