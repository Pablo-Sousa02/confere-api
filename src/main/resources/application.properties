spring.application.name=confere

spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
server.port=${PORT:8080}

server.error.include-message=never
server.error.include-stacktrace=never

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.jackson.deserialization.fail-on-unknown-properties=true
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=confere
app.jwt.ttl-seconds=1800
app.cors.origins=${CORS_ALLOWED_ORIGINS:}
app.bootstrap.enabled=${BOOTSTRAP_ENABLED:false}
app.bootstrap.nome=${BOOTSTRAP_ADMIN_NAME:}
app.bootstrap.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.senha=${BOOTSTRAP_ADMIN_PASSWORD:}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
server.forward-headers-strategy=none
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000
spring.mail.properties.mail.debug=false
app.email.from=${EMAIL_FROM:no-reply@confere.local}
app.reset.url=${RESET_PASSWORD_URL:http://localhost:5173/redefinir-senha}
app.reset.enabled=${PASSWORD_RESET_ENABLED:true}
app.abuse.auth-per-minute=${AUTH_RATE_LIMIT:15}
app.abuse.upload-per-minute=${UPLOAD_RATE_LIMIT:10}
app.abuse.account-per-minute=${LOGIN_ACCOUNT_RATE_LIMIT:10}
